# Lydia — portabel drift (Hostinger VPS). PostgreSQL + backend + frontend.
#
# Första gången:
#   1. cp server/.env.example server/.env   (fyll i hemligheter)
#   2. export DB_PASSWORD=... LYDIA_APP_PASSWORD=...   (eller en .env bredvid denna fil)
#   3. docker compose up -d db
#   4. docker compose --profile tools run --rm migrate
#   5. LYDIA_ADMIN_EMAIL=... LYDIA_ADMIN_PASSWORD=... docker compose --profile tools run --rm create-admin
#   6. docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: lydia
      POSTGRES_USER: lydia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Sätt DB_PASSWORD}
      LYDIA_APP_PASSWORD: ${LYDIA_APP_PASSWORD:?Sätt LYDIA_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/init-role.sh:/docker-entrypoint-initdb.d/10-init-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lydia -d lydia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      HOST: 0.0.0.0
      TRUST_PROXY: "2"
      NODE_ENV: production
      # Appen kör som lydia_app (endast DML, ingen BYPASSRLS) så FORCE RLS gäller.
      DATABASE_URL: postgresql://lydia_app:${LYDIA_APP_PASSWORD}@db:5432/lydia
    volumes:
      - ${STORAGE_DIR:-/var/lydia/files}:/var/lydia/files

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/container.conf:/etc/nginx/conf.d/default.conf:ro

  # Engångsjobb (profil "tools"): körs med ägar-rollen.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATE_DATABASE_URL: postgresql://lydia:${DB_PASSWORD}@db:5432/lydia
    command: ["node", "scripts/migrate.mjs"]

  create-admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://lydia:${DB_PASSWORD}@db:5432/lydia
      LYDIA_ADMIN_EMAIL: ${LYDIA_ADMIN_EMAIL:-}
      LYDIA_ADMIN_PASSWORD: ${LYDIA_ADMIN_PASSWORD:-}
      LYDIA_CLINIC_NAME: ${LYDIA_CLINIC_NAME:-Lydia Estetisk}
    command: ["node", "scripts/create-admin.mjs"]

  # Säkerhetstest (profil "tools"): körs som appens roll lydia_app mot den riktiga databasen.
  # Skapar två tillfälliga testkliniker och raderar dem. Ska vara grönt innan go-live.
  security-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://lydia_app:${LYDIA_APP_PASSWORD}@db:5432/lydia
    command: ["node", "scripts/security-test.mjs"]


volumes:
  pgdata: