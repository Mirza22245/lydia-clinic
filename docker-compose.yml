# Lydia — Docker Compose för portabel drift (Hostinger VPS eller lokal).
# Startar: PostgreSQL (med icke-superuser app-role) + Lydia backend + Lydia frontend (nginx).
# Använd: docker-compose up -d --build
#
# VIKTIGT: Innan första start, skapa app-rollen:
#   docker-compose exec db psql -U lydia -d lydia -v pw='<starkt lösenord>' -f /init-role.sql
# och sätt DATABASE_URL med lydia_app:<lösenord>.

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: lydia
      POSTGRES_USER: lydia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/init-role.sh:/docker-entrypoint-initdb.d/init-role.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lydia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://lydia_app:${LYDIA_APP_PASSWORD:-change-me}@db:5432/lydia
    volumes:
      - ${STORAGE_DIR:-/var/lydia/files}:/var/lydia/files
    ports:
      - "127.0.0.1:3001:3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/lydia.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata: