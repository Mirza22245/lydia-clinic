# Lydia — Docker Compose för portabel drift (Hostinger VPS eller lokal)
# Startar: PostgreSQL + Lydia backend + Lydia frontend (nginx)
# Använd: docker-compose up -d

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: lydia
      POSTGRES_USER: lydia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lydia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://lydia:${DB_PASSWORD:-change-me}@db:5432/lydia
    ports:
      - "3001:3001"

  frontend:
    build: .
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    # Byggd statisk React-bundle serveras av nginx

volumes:
  pgdata: