name: Lydia production check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lydia-production-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run check:system
      - run: npm run lint > lint.log 2>&1; status=$?; cat lint.log; exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log
          path: lint.log
      - run: npm run typecheck
      - run: npm run build
