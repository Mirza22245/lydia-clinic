# Host-nginx för Lydia på Hostinger VPS.
# Målet är EN kundupplevelse: lydiaestetisk.se är huvudadressen och
# app.lydiaestetisk.se är en teknisk aliasadress till samma Lydia-webbapp.
# Allt (SPA + /api) proxas till frontend-containern på 127.0.0.1:8080,
# som i sin tur proxar /api till backend.
# När DNS/cert är redo ska WordPress inte längre ligga framför kundflödet.
server_tokens off;

server {
    listen 80;
    server_name lydiaestetisk.se www.lydiaestetisk.se app.lydiaestetisk.se;
    return 301 https://lydiaestetisk.se$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lydiaestetisk.se www.lydiaestetisk.se app.lydiaestetisk.se;
    # Certifikatet måste täcka lydiaestetisk.se, www och app.
    ssl_certificate /etc/letsencrypt/live/lydiaestetisk.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lydiaestetisk.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}