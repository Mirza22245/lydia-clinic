# nginx för Lydia — app.lydiaestetisk.se (frontend) + api.lydiaestetisk.se (backend).
# TLS via Let's Encrypt (certbot). Säkerhetsheaders sätts av backend (helmet)
# och kompletteras här. Reverse-proxy till Node (127.0.0.1:3001) och statisk SPA.

# --- API: api.lydiaestetisk.se ---
server {
    listen 443 ssl http2;
    server_name api.lydiaestetisk.se;
    ssl_certificate /etc/letsencrypt/live/api.lydiaestetisk.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lydiaestetisk.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# --- App: app.lydiaestetisk.se (statisk SPA) ---
server {
    listen 443 ssl http2;
    server_name app.lydiaestetisk.se;
    ssl_certificate /etc/letsencrypt/live/app.lydiaestetisk.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lydiaestetisk.se/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/lydia/web;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }

    # Statiska assets cache-längre
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

# --- HTTP -> HTTPS redirect ---
server {
    listen 80;
    server_name app.lydiaestetisk.se api.lydiaestetisk.se;
    return 301 https://$host$request_uri;
}